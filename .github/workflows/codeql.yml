name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 7 * * 4"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    # L'extracteur Swift ne tourne que sur macOS et a besoin d'une vraie
    # compilation pour résoudre les types et les appels.
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          # `manual` plutôt qu'`autobuild` : autobuild devine le schéma et la
          # destination, et se trompe dès qu'un projet a plusieurs cibles.
          build-mode: manual
          queries: security-extended

      # Destination générique : on compile pour analyser, pas pour exécuter,
      # donc inutile de résoudre un simulateur concret.
      - name: Build
        run: |
          xcodebuild build \
            -project WaveFlow.xcodeproj \
            -scheme WaveFlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
