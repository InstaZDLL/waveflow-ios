# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: fr-FR
tone_instructions: >-
  Sois direct et concis. Priorise les bugs réels, les régressions
  utilisateur, les problèmes de sécurité, les erreurs de logique et les
  oublis de tests/validation. Évite les remarques purement cosmétiques.
early_access: true
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "chore: bump"
      - "chore(main): release"
      - "release-please"
      - "dependabot"
      - "[bot]"
  path_filters:
    - "!**/build/**"
    - "!**/DerivedData/**"
    - "!**/*.xcuserstate"
    - "!**/xcuserdata/**"
    - "!**/*.png"
    - "!**/*.jpg"
  path_instructions:
    - path: "WaveFlow/Model/**"
      instructions: >-
        Modèle métier pur, sans dépendance à une source de données. Refuse
        toute référence à AVFoundation, au système de fichiers ou au réseau :
        ce dossier doit rester réutilisable quand la sync serveur arrivera.
        Les types y sont `nonisolated` et `Sendable` — ils traversent les
        frontières d'acteur depuis le scan en arrière-plan. Signale toute
        propriété calculée coûteuse : `Library` est reconstruite à chaque
        émission du scan, et ses vues dérivées sont lues à chaque tic de
        position du lecteur.
    - path: "WaveFlow/Data/**"
      instructions: >-
        Couche données. `MusicRepository` doit rester une abstraction
        storage-agnostique ; les détails du dossier Documents vivent dans
        `DocumentsMusicRepository`. Vérifie que le scan reste hors du main
        actor, que la concurrence d'ouverture des `AVURLAsset` reste bornée
        (les descripteurs de fichiers sont une ressource finie), que l'état
        partagé est bien protégé par le verrou, et que les `DispatchSource`
        sont annulés et leurs descripteurs fermés. Un fichier illisible doit
        être ignoré, jamais faire échouer la bibliothèque entière.
    - path: "WaveFlow/Data/LibraryScanner.swift"
      instructions: >-
        Lecture des tags. Les fichiers du monde réel sont mal taggés : vérifie
        que chaque tag manquant a un repli explicite, que l'absence de
        `albumArtist` (`aART`) n'éclate pas un album en autant d'artistes
        invités, et que les identifiants de regroupement restent stables entre
        deux scans — ils servent de clés au cache de pochettes et à la
        navigation.
    - path: "WaveFlow/Playback/**"
      instructions: >-
        Intégration AVFoundation. Il n'y a pas de `MediaSessionService` ici :
        c'est `UIBackgroundModes: audio` qui maintient l'app en vie, et
        `MPNowPlayingInfoCenter` / `MPRemoteCommandCenter` doivent être
        alimentés à la main — vérifie qu'ils restent cohérents avec l'état réel
        du lecteur après chaque commande. Vérifie la catégorie et l'activation
        de l'`AVAudioSession`, la libération des observateurs (`removeObserver`,
        `removeTimeObserver`, `invalidate`), l'absence de cycle de rétention
        dans les closures d'observation, et que `MainActor.assumeIsolated` n'est
        utilisé que sur des callbacks réellement délivrés sur la file
        principale. Signale toute gestion de file qui casserait l'aléatoire, la
        répétition ou le « précédent ».
    - path: "WaveFlow/UI/**"
      instructions: >-
        SwiftUI. Vérifie l'identité des vues (un `if/else` autour d'un
        conteneur jette l'état de ses enfants — la pile de navigation vit dans
        `RootView` précisément pour ça), les `task`/`onChange` mal clés,
        l'accessibilité (`accessibilityLabel` sur les boutons à icône seule,
        cible tactile >= 44pt, contraste), et le respect du thème : couleurs
        sémantiques d'iOS ou palette de `Theme.swift`, jamais de valeur codée
        en dur. Le rendu doit rester piloté par un état immuable.
    - path: "WaveFlow/Info.plist"
      instructions: >-
        Vérifie que `UIBackgroundModes` contient bien `audio` (sans quoi le son
        est coupé en arrière-plan) et que `UIFileSharingEnabled` /
        `LSSupportsOpeningDocumentsInPlace` restent activés — c'est la seule
        façon pour l'utilisateur d'alimenter sa bibliothèque. Signale toute
        clé ajoutée en double avec un réglage `INFOPLIST_KEY_*` du projet.
    - path: "WaveFlow.xcodeproj/**"
      instructions: >-
        Vérifie que la cible de déploiement reste cohérente avec les API
        utilisées, que `SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor` n'est pas
        retiré par inadvertance (tout le code en dépend), et que l'exception
        d'appartenance sur `Info.plist` reste en place — sans elle, le groupe
        synchronisé le recopie comme ressource et la compilation échoue sur un
        conflit de commandes.
    - path: "WaveFlowTests/**"
      instructions: >-
        Swift Testing. Vérifie que les tests ne dépendent ni d'un vrai fichier
        audio ni du dossier Documents réel — le scan doit être testable via une
        arborescence temporaire. Signale les tests qui dépendent de l'ordre
        d'exécution ou du temps qui passe.
    - path: ".github/workflows/**"
      instructions: >-
        Workflows GitHub Actions. Vérifie les risques d'injection via branches
        ou PR non fiables, la portée des secrets (notamment tout certificat de
        signature iOS), les permissions minimales, et les actions non épinglées
        par SHA.

  tools:
    swiftlint:
      enabled: true
    opengrep:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
    semgrep:
      enabled: false

chat:
  auto_reply: true
